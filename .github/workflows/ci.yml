# Verification only. Cloudflare Workers Builds, configured outside GitHub
# Actions, deploys the Worker; publishing books is a separate local command.
name: CI (no deployment)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run already in flight.
# Runs on main are left alone: every commit there has landed, and its result is
# worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fork pull requests run this workflow. Nothing here pushes, so the
          # token has no reason to outlive the checkout step.
          persist-credentials: false

      # One version, the one engines declares. A matrix across Node versions
      # would double this job to learn nothing: Biome is a Rust binary, and
      # the typecheck reads a pinned @types/node, so neither can vary by
      # runtime — and nothing here executes the project's own code. That is
      # what the `test` job below does, and where a matrix would belong.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Fail if the lockfile and manifests disagree.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Before the types, because the app's route types are generated by the
      # build. Turborepo orders this correctly on its own; running them in
      # this order just makes a failure easier to read.
      - run: pnpm build

      - run: pnpm check-types

  worker:
    name: Bundle the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fork pull requests run this workflow. Nothing here pushes, so the
          # token has no reason to outlive the checkout step.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catches what `next build` cannot: that the app still bundles for
      # workerd. Bundling needs no Cloudflare credentials — only deploying
      # does. Through Turborepo rather than the CLI directly, so the packages
      # the build imports are built first.
      - run: pnpm bundle

      # Also checks that a deploy cannot discard the dashboard-managed BOOKS
      # binding and that no deployment credentials were bundled into code.
      - run: node ../../tools/check-worker-env.mjs
        working-directory: apps/readlet

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fork pull requests run this workflow. Nothing here pushes, so the
          # token has no reason to outlive the checkout step.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The root test script runs through Turbo, which builds the packages
      # before tests import their dist output.
      #
      # The fixtures are generated, so nothing here reaches the network or
      # needs a book to hand — and nothing needs `cwebp` or `pdftoppm` either,
      # since the one part of the pipeline that shells out to them is the one
      # part these tests leave alone.
      - run: pnpm test
