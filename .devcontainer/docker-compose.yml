services:
  dev:
    container_name: readlet
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
    init: true
    working_dir: /workspaces/readlet
    volumes:
      - ..:/workspaces/readlet:cached
      - readlet_history:/home/node/.history
      - readlet_pnpm_cache:/home/node/.local/share/pnpm
    command: sleep infinity

volumes:
  readlet_history:
  readlet_pnpm_cache:
